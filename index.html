<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Wheel of Fortune</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;600;800&display=swap');

    body {
      font-family: 'Inter', sans-serif;
      background-color: #1a0505;
      overflow-x: hidden;
      /* Prevent horizontal scroll, allow vertical */
      min-height: 100vh;
    }

    /* Custom Scrollbar hide */
    ::-webkit-scrollbar {
      width: 0px;
      background: transparent;
    }

    .text-shadow-premium {
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.5);
    }

    .perspective-text {
      text-shadow: 0 1px 0 #b8860b,
        0 2px 0 #a07204,
        0 3px 0 #8a6e05,
        0 4px 0 #745100,
        0 10px 20px rgba(0, 0, 0, 0.5);
    }

    /* --- NEW ANIMATIONS --- */

    @keyframes modalEnter {
      0% {
        opacity: 0;
        transform: scale(0.92);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes goldPulse {
      0% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.5;
      }

      50% {
        transform: translate(-50%, -50%) scale(1.06);
        opacity: 0.8;
      }

      100% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 0.5;
      }
    }

    @keyframes sparkleFloat {
      0% {
        transform: translate(0, 0) scale(0);
        opacity: 0;
      }

      20% {
        opacity: 1;
        transform: translate(var(--tx), -20px) scale(1);
      }

      100% {
        transform: translate(var(--tx), -120px) scale(0);
        opacity: 0;
      }
    }

    .animate-modal-enter {
      animation: modalEnter 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    .animate-gold-pulse {
      animation: goldPulse 4s ease-in-out infinite;
    }

    .sparkle {
      position: absolute;
      width: 4px;
      height: 4px;
      background: #FFD700;
      border-radius: 50%;
      box-shadow: 0 0 4px #FFF, 0 0 8px #FFD700;
      pointer-events: none;
      opacity: 0;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.4/",

}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>

</body>

</html>
